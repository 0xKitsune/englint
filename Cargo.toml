[package]
name = "englint"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A source-preserving English text AST and configurable prose linter"
license = "MIT"
repository = "https://github.com/0xKitsune/englint"

[dependencies]
clap = { version = "4", features = ["derive"] }
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[[bin]]
name = "englint"
path = "src/main.rs"
